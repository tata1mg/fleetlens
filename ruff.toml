# One lint config for the whole repository, at the root on purpose: ruff resolves config
# per file from the nearest ancestor, so a config inside packages/fleetlens/ would leave
# bench/ linted under whatever the installed ruff happens to default to.
#
# `select` is explicit for the same reason. Ruff's default rule set grows between releases,
# and an implicit set means a linter upgrade turns an unrelated pull request red.

line-length = 100
target-version = "py310"

[lint]
# Correctness plus import ordering. Deliberately not the `UP` modernisation set: it wants
# ~60 `Optional[X]` rewrites that change nothing a reader cares about, and a linter that
# mostly reports taste is one people learn to ignore.
select = ["E4", "E7", "E9", "F", "I", "W"]
